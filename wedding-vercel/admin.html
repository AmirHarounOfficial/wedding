<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ردود الضيوف — أمير و سوسن</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa&family=Cormorant+Garamond:wght@400;500;600&family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f2e8; --paper:#fffcf6; --ink:#3b4354; --muted:#79839a;
  --gold:#bd9526; --gold-2:#e0ca8f; --line:rgba(189,149,38,.24); --on-gold:#fffdf6;
  --green:#5d8a5e; --red:#9d2235;
  --shadow:0 14px 40px -22px rgba(45,58,84,.45);
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#14161f; --paper:#1e202c; --ink:#ece2ce; --muted:#9aa3b5;
         --gold:#e0bc63; --gold-2:#8f7440; --line:rgba(224,188,99,.22); --on-gold:#2b2309;
         --green:#7fb280; --red:#e08290; --shadow:0 14px 40px -22px rgba(0,0,0,.8); }
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'Tajawal',system-ui,'Segoe UI',sans-serif;
  padding:26px 18px 70px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit;color:inherit}

.head{max-width:940px;margin:0 auto 26px;text-align:center}
.head h1{font-family:'Aref Ruqaa',serif;font-weight:400;color:var(--gold);
  font-size:clamp(1.7rem,6vw,2.4rem);margin:0}
.head p{color:var(--muted);margin:6px 0 0;font-size:.92rem}
.orn{display:flex;align-items:center;justify-content:center;gap:12px;margin:14px 0 0;color:var(--gold)}
.orn::before,.orn::after{content:'';height:1px;flex:1;max-width:110px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent)}

.wrap{max-width:940px;margin:0 auto}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:26px}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:18px;
  padding:20px 14px;text-align:center;box-shadow:var(--shadow)}
.tile .n{display:block;font-family:'Cormorant Garamond',serif;font-weight:600;
  font-size:2.4rem;line-height:1;color:var(--gold)}
.tile .l{display:block;margin-top:8px;font-size:.8rem;color:var(--muted);letter-spacing:.06em}
.tile.big .n{color:var(--green)}

.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:18px}
.btn{display:inline-flex;align-items:center;gap:8px;background:var(--paper);
  border:1px solid var(--line);border-radius:12px;padding:9px 15px;font-size:.88rem;transition:.25s}
.btn:hover{border-color:var(--gold);background:rgba(189,149,38,.08)}
.btn.on{background:var(--gold);color:var(--on-gold);border-color:transparent}
.spacer{flex:1}
.stamp{color:var(--muted);font-size:.78rem}

.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;
  padding:22px;box-shadow:var(--shadow);margin-bottom:20px}
.panel h2{margin:0 0 4px;font-size:1.15rem;font-weight:500;display:flex;align-items:center;gap:9px}
.panel h2 .c{background:var(--gold);color:var(--on-gold);border-radius:999px;
  font-size:.72rem;padding:2px 9px;font-weight:500}
.panel .hint{color:var(--muted);font-size:.84rem;margin:0 0 16px}

.list{display:grid;gap:9px}
.item{display:flex;align-items:flex-start;gap:12px;background:var(--bg);
  border:1px solid var(--line);border-radius:14px;padding:13px 15px}
.item .who{font-weight:500;margin:0;display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.item .meta{color:var(--muted);font-size:.78rem;margin:3px 0 0}
.item .msg{margin:7px 0 0;font-weight:300;white-space:pre-wrap;overflow-wrap:anywhere}
.item .grow{flex:1;min-width:0}
.actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;margin-inline-start:auto}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:.75rem;padding:2px 8px;border-radius:999px;font-weight:500}
.badge.private{background:rgba(157,34,53,.15);color:var(--red)}
.badge.public{background:rgba(93,138,94,.15);color:var(--green)}
.priv-btn{font-size:.78rem;padding:5px 11px;border-radius:9px;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:.25s;flex:0 0 auto}
.priv-btn:hover{border-color:var(--gold);background:rgba(189,149,38,.12)}
.del{color:var(--muted);font-size:1.1rem;line-height:1;padding:4px 8px;border-radius:8px;flex:0 0 auto}
.del:hover{background:rgba(157,34,53,.12);color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:22px 0;font-size:.9rem}

.fault{max-width:560px;margin:8vh auto 0}
.fault .head h1{color:var(--red);font-size:clamp(1.4rem,5vw,1.9rem)}
.fmsg{margin:0 0 14px;font-size:1rem;line-height:1.75}
.fsteps{margin:0;padding-inline-start:1.3em;display:grid;gap:11px;
  font-size:.95rem;line-height:1.7;color:var(--ink)}
.fsteps li::marker{color:var(--gold);font-weight:700}
.fault code{background:rgba(189,149,38,.14);border-radius:6px;padding:3px 8px;
  font-family:ui-monospace,Consolas,monospace;font-size:.86em;
  direction:ltr;unicode-bidi:isolate;text-align:left;
  display:inline-block;margin-top:5px;overflow-wrap:anywhere}

.gate{max-width:380px;margin:14vh auto;text-align:center}
.gate input{width:100%;background:var(--paper);border:1px solid var(--line);
  border-radius:12px;padding:13px 15px;margin:16px 0 12px;text-align:center;outline:none}
.gate input:focus{border-color:var(--gold)}
.err{color:var(--red);font-size:.86rem;min-height:1.2em}
</style>
</head>
<body>

<!-- key gate -->
<div class="gate" id="gate" hidden>
  <div class="head"><h1>ردود الضيوف</h1><p>أدخل كلمة الدخول</p></div>
  <input id="keyInput" type="password" placeholder="كلمة الدخول" autocomplete="current-password">
  <button class="btn on" id="keyBtn" style="width:100%;justify-content:center">دخول</button>
  <p class="err" id="gateErr"></p>
</div>

<!-- visible failure panel -->
<div class="fault" id="fault" hidden>
  <div class="head"><h1 id="faultTitle"></h1></div>
  <div class="panel">
    <p class="fmsg" id="faultMsg"></p>
    <ol class="fsteps" id="faultSteps"></ol>
    <button class="btn on" id="faultRetry" style="margin-top:18px">جرّب تاني</button>
  </div>
</div>

<div id="app" hidden>
  <div class="head">
    <h1>ردود الضيوف</h1>
    <p>أمير &amp; سوسن · الأحد 11 أكتوبر 2026</p>
    <div class="orn">✦</div>
  </div>

  <div class="wrap">
    <div class="tiles">
      <div class="tile big"><span class="n" id="tWishes">0</span><span class="l">إجمالي التهاني</span></div>
      <div class="tile"><span class="n" id="tPublic" style="color:var(--gold)">0</span><span class="l">عامة 🌐</span></div>
      <div class="tile"><span class="n" id="tPrivate" style="color:var(--red)">0</span><span class="l">خاصة للعروسين 🔒</span></div>
    </div>

    <div class="bar">
      <button class="btn" id="refreshBtn">↻ تحديث</button>
      <button class="btn" id="autoBtn">تحديث تلقائي: مُفعّل</button>
      <button class="btn" id="csvBtn">⭳ تنزيل CSV</button>
      <span class="spacer"></span>
      <span class="stamp" id="stamp"></span>
    </div>

    <div class="panel">
      <h2>التهاني <span class="c" id="cW">0</span></h2>
      <div class="list" id="wishList"></div>
      <p class="empty" id="wEmpty">لا توجد تهاني بعد</p>
    </div>
  </div>
</div>

<script>
/* Vercel → '/api/guests'   ·   aaPanel/PHP → 'api.php' */
const API = '/api/guests';

const $ = s => document.querySelector(s);
let KEY = new URLSearchParams(location.search).get('key')
       || sessionStorage.getItem('admin.key') || '';
let auto = true, timer = null, data = null;

const fmt = iso => {
  const d = new Date(iso);
  return d.toLocaleDateString('ar-EG', { day:'numeric', month:'long' })
       + ' · ' + d.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' });
};

async function load(){
  if (!KEY) return showGate();

  let r;
  try {
    r = await fetch(API + '?action=admin&key=' + encodeURIComponent(KEY), { cache:'no-store' });
  } catch (e) {
    return showFault('مفيش اتصال بالـ API',
      `الصفحة مش قادرة توصل لـ <code>${API}</code>.`,
      ['اتأكد إن الملف مرفوع في المكان الصح',
       'لو على Vercel: لازم يكون في <code>api/guests.js</code>',
       'لو على aaPanel: غيّر <code>API</code> في أول سكربت الصفحة لـ <code>api.php</code>']);
  }

  if (r.status === 401){
    sessionStorage.removeItem('admin.key'); KEY = '';
    return showGate('كلمة الدخول غير صحيحة');
  }

  let payload = null;
  try { payload = await r.json(); } catch {}

  if (!r.ok){
    // ask the API what's actually missing, so the message is specific
    let diag = null;
    try {
      const c = await fetch(API + '?action=check&key=' + encodeURIComponent(KEY), { cache:'no-store' });
      if (c.ok) diag = await c.json();
    } catch {}

    if ((payload && payload.error === 'store_not_connected') ||
        (diag && diag.storeConfigured === false)){
      return showFault('قاعدة البيانات لسه متوصلتش',
        'الدعوة شغالة، بس الردود مالهاش مكان تتخزن فيه لحد ما توصّل قاعدة البيانات.',
        ['من لوحة Vercel افتح المشروع، وبعدين:<br><code>Storage → Create → Upstash for Redis → Connect</code>',
         'ضيف كلمة الدخول بتاعتك:<br><code>Settings → Environment Variables → ADMIN_KEY</code>',
         'وأخيراً اعمل ريديبلوي، <b>من غيرها مش هتشتغل</b>:<br><code>Deployments → ⋯ → Redeploy</code>']);
    }

    return showFault('خطأ من السيرفر (' + r.status + ')',
      (payload && payload.error) ? String(payload.error) : 'رد غير متوقع من الـ API.',
      diag ? ['<code>' + JSON.stringify(diag) + '</code>'] : []);
  }

  data = payload;
  sessionStorage.setItem('admin.key', KEY);
  $('#fault').hidden = true;
  $('#gate').hidden  = true;
  $('#app').hidden   = false;
  render();
}

/* a visible failure panel — never write errors into #app, it starts hidden */
function showFault(title, msg, steps){
  clearInterval(timer);
  $('#app').hidden   = true;
  $('#gate').hidden  = true;
  $('#fault').hidden = false;
  $('#faultTitle').textContent = title;
  $('#faultMsg').innerHTML = msg;
  const ol = $('#faultSteps');
  ol.textContent = '';
  (steps || []).forEach(s => { const li = document.createElement('li'); li.innerHTML = s; ol.appendChild(li); });
  ol.hidden = !(steps && steps.length);
}

function showGate(msg){
  $('#app').hidden = true; $('#fault').hidden = true; $('#gate').hidden = false;
  $('#gateErr').textContent = msg || '';
  $('#keyInput').focus();
}

function render(){
  const wishes = data.wishes || [];
  const n = wishes.length;
  const nPrivate = (data.totals && typeof data.totals.wishesPrivate === 'number')
    ? data.totals.wishesPrivate
    : wishes.filter(w => w.isPrivate).length;
  const nPublic = (data.totals && typeof data.totals.wishesPublic === 'number')
    ? data.totals.wishesPublic
    : (n - nPrivate);

  $('#tWishes').textContent  = n;
  if ($('#tPublic')) $('#tPublic').textContent = nPublic;
  if ($('#tPrivate')) $('#tPrivate').textContent = nPrivate;
  $('#cW').textContent       = n;

  const ws = wishes.slice().sort((a,b)=>b.at.localeCompare(a.at));
  fill('#wishList','#wEmpty', ws, w => wishRow(w));

  $('#stamp').textContent = 'آخر تحديث ' +
    new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

function fill(listSel, emptySel, arr, mk){
  const box = $(listSel);
  box.textContent = '';
  $(emptySel).hidden = arr.length > 0;
  arr.forEach(x => box.appendChild(mk(x)));
}

function wishRow(w){
  const el = document.createElement('div');
  el.className = 'item';

  const grow = document.createElement('div');
  grow.className = 'grow';

  const whoHeader = document.createElement('p');
  whoHeader.className = 'who';
  whoHeader.textContent = w.name + ' ';

  const badge = document.createElement('span');
  badge.className = 'badge ' + (w.isPrivate ? 'private' : 'public');
  badge.textContent = w.isPrivate ? 'خاصة 🔒' : 'عامة 🌐';
  whoHeader.appendChild(badge);

  const meta = document.createElement('p');
  meta.className = 'meta';
  meta.textContent = fmt(w.at);

  grow.append(whoHeader, meta);
  if (w.msg){
    const m = document.createElement('p');
    m.className = 'msg';
    m.textContent = w.msg;
    grow.append(m);
  }
  el.append(grow);

  const actions = document.createElement('div');
  actions.className = 'actions';

  const toggleBtn = document.createElement('button');
  toggleBtn.className = 'priv-btn';
  toggleBtn.title = w.isPrivate ? 'تغيير إلى عامة' : 'تغيير إلى خاصة';
  toggleBtn.textContent = w.isPrivate ? '🌐 جعلها عامة' : '🔒 جعلها خاصة';
  toggleBtn.onclick = async () => {
    toggleBtn.disabled = true;
    try {
      await fetch(API + '?action=toggle_private&key=' + encodeURIComponent(KEY), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: w.id, isPrivate: !w.isPrivate })
      });
    } catch {}
    load();
  };
  actions.append(toggleBtn);

  const del = document.createElement('button');
  del.className = 'del'; del.title = 'حذف'; del.textContent = '×';
  del.onclick = async () => {
    if (!confirm(`حذف "${w.name}"؟`)) return;
    await fetch(API + '?action=delete&key=' + encodeURIComponent(KEY),
      { method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ kind: 'wish', id: w.id }) });
    load();
  };
  actions.append(del);

  el.append(actions);
  return el;
}

$('#refreshBtn').onclick = load;
$('#autoBtn').onclick = e => {
  auto = !auto;
  e.target.textContent = 'تحديث تلقائي: ' + (auto ? 'مُفعّل' : 'موقوف');
  e.target.classList.toggle('on', auto);
  clearInterval(timer);
  if (auto) timer = setInterval(load, 20000);
};
$('#csvBtn').onclick = () => {
  if (!data) return;
  const q = s => `"${String(s).replace(/"/g,'""')}"`;
  const lines = [['الاسم','الوقت','النوع','التهنئة'].map(q).join(',')];
  (data.wishes || []).forEach(w => lines.push([w.name, w.at, w.isPrivate ? 'خاصة' : 'عامة', w.msg].map(q).join(',')));
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'sawsan-amir-wishes.csv';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
};
$('#faultRetry').onclick = () => { if (auto) timer = setInterval(load, 20000); load(); };
$('#keyBtn').onclick = () => { KEY = $('#keyInput').value.trim(); load(); };
$('#keyInput').addEventListener('keydown', e => { if (e.key === 'Enter') $('#keyBtn').click(); });

$('#autoBtn').classList.add('on');
timer = setInterval(load, 20000);
load();
</script>
</body>
</html>
